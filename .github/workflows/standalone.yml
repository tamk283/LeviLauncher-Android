name: Standalone debug APK

on:
  push:
    branches: [standalone-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'
      - name: Configure isolated development Firebase identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = {
              'project_info': {
                  'project_number': '000000000000',
                  'project_id': 'standalone-local-dev',
                  'storage_bucket': 'standalone-local-dev.appspot.com'
              },
              'client': [{
                  'client_info': {
                      'mobilesdk_app_id': '1:000000000000:android:0000000000000000000000',
                      'android_client_info': {'package_name': 'org.levimc.launcher'}
                  },
                  'oauth_client': [],
                  'api_key': [{'current_key': 'AIzaSyCIOnlyPlaceholderKey'}],
                  'services': {'appinvite_service': {'other_platform_oauth_client': []}}
              }],
              'configuration_version': '1'
          }
          Path('app/google-services.json').write_text(json.dumps(data))
          PY
      - name: Build debug APK without Discord SDK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace -Pdiscord.application_id=0
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: standalone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
