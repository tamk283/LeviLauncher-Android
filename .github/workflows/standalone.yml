name: Nemesis debug APK

on:
  push:
    branches: [standalone-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'
      - name: Configure isolated development Firebase identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = {
              'project_info': {
                  'project_number': '000000000000',
                  'project_id': 'standalone-local-dev',
                  'storage_bucket': 'standalone-local-dev.appspot.com'
              },
              'client': [{
                  'client_info': {
                      'mobilesdk_app_id': '1:000000000000:android:0000000000000000000000',
                      'android_client_info': {'package_name': 'org.levimc.launcher'}
                  },
                  'oauth_client': [],
                  'api_key': [{'current_key': 'AIzaSyCIOnlyPlaceholderKey'}],
                  'services': {'appinvite_service': {'other_platform_oauth_client': []}}
              }],
              'configuration_version': '1'
          }
          Path('app/google-services.json').write_text(json.dumps(data))
          PY
      - name: Check Nemesis integration
        run: python3 scripts/check_nemesis.py
      - name: Build debug APK without Discord SDK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace -Pdiscord.application_id=0
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: standalone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
      - name: Publish Nemesis APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Nemesis-debug.apk
          gh release create "nemesis-build-${{ github.run_number }}" Nemesis-debug.apk --target "${{ github.sha }}" --prerelease --title "Nemesis test build ${{ github.run_number }}" --notes 'Nemesis Android: packaged animated HTML launcher and in-game client menu, native Microsoft login and installed/imported version launch, bridge to upstream Auto Sprint, Zoom, FPS/CPS, Gyro, Camera and HUD modules. ESP/Tracers/Name Tags/Fullbright/Aim/Trigger/Step remain unavailable. Minecraft is not included. Added read-only in-game ELF Build ID and SHA-256 diagnostics for the analyzed 1.26.60.4 ARM64 binary. ESP remains disabled; physical-device testing pending. Apache-2.0 upstream credits retained.'
